function updateTears() {
  const room = G.room;
  for (const t of G.tears) {
    if (t.dead) continue;
    if (t.returning) {
      const a = Math.atan2(G.player.y - t.y, G.player.x - t.x);
      t.vx = lerp(t.vx, Math.cos(a) * 12, 0.12); t.vy = lerp(t.vy, Math.sin(a) * 12, 0.12);
      if (dist(t.x, t.y, G.player.x, G.player.y) < 22) t.dead = true;
    }
    if (t.boomerang && !t.returning && t.life < t.maxLife * 0.55) t.returning = true;
    if (t.knife && !t.returning && t.life < t.maxLife - t.returnDelay) t.returning = true;
    if (t.homing && !t.returning) {
      let near = null, nd = 420;
      for (const e of room.enemies) {
        if (e.dead) continue;
        const d = dist(t.x, t.y, e.x, e.y);
        if (d < nd) { nd = d; near = e; }
      }
      if (near) {
        const a = Math.atan2(near.y - t.y, near.x - t.x), sp = Math.hypot(t.vx, t.vy);
        t.vx = lerp(t.vx, Math.cos(a) * sp, t.homing * 1.6);
        t.vy = lerp(t.vy, Math.sin(a) * sp, t.homing * 1.6);
      }
    }
    if (t.orbit && !t.returning) {
      t.orbitAngle += 0.045;
      t.x = G.player.x + Math.cos(t.orbitAngle) * 90;
      t.y = G.player.y + Math.sin(t.orbitAngle) * 90;
    } else { t.x += t.vx; t.y += t.vy; }
    if (t.wavy) {
      const perp = t.angle + Math.PI / 2;
      t.x += Math.cos(perp) * Math.sin(t.life * 0.25) * 0.8;
      t.y += Math.sin(perp) * Math.sin(t.life * 0.25) * 0.8;
    }
    t.life--;
    if (t.life <= 0) {
      if (t.explosive) explode(t.x, t.y, t.explosiveRadius, t.damage * 1.2, { harmPlayer: false });
      t.dead = true; continue;
    }
    if (t.x < 0 || t.x > ARENA_W || t.y < 0 || t.y > ARENA_H) {
      if (t.wrap) { t.x = (t.x + ARENA_W) % ARENA_W; t.y = (t.y + ARENA_H) % ARENA_H; }
      else if (t.bounce > 0) {
        if (t.x < 0 || t.x > ARENA_W) t.vx *= -1;
        if (t.y < 0 || t.y > ARENA_H) t.vy *= -1;
        t.bounce--; t.x = clamp(t.x, 4, ARENA_W - 4); t.y = clamp(t.y, 4, ARENA_H - 4);
      } else { t.dead = true; continue; }
    }
    // 眼泪可以扑灭火堆
    for (const h of room.hazards) {
      if (h.type === "fire" && dist(t.x, t.y, h.x, h.y) < t.r + h.r + 5) {
        extinguishFire(h);
        if (t.explosive) { /* 保留爆炸流程 */ } else { t.dead = true; }
        break;
      }
    }
    if (t.dead) continue;
    if (!t.spectral && tearHitsSolid(room, t.x, t.y, t.r)) {
      const tx = Math.floor(t.x / TILE), ty = Math.floor(t.y / TILE);
      const o = room.obstacles.find((ob) => !ob.dead && ob.tx === tx && ob.ty === ty);
      if (o && o.type === "poop") { o.hp -= t.damage; if (o.hp <= 0) destroyObstacle(o); }
      if (o && o.type === "tnt") { destroyObstacle(o); spawnBomb(o.x, o.y, { fuse: 4 }); }
      if (t.explosive) { explode(t.x, t.y, t.explosiveRadius, t.damage * 1.2, { harmPlayer: false }); t.dead = true; continue; }
      if (t.bounce > 0) {
        const testX = t.x - t.vx, testY = t.y - t.vy;
        if (tearHitsSolid(room, t.x, testY, t.r)) t.vy *= -1;
        if (tearHitsSolid(room, testX, t.y, t.r)) t.vx *= -1;
        t.x += t.vx * 2; t.y += t.vy * 2; t.bounce--;
      } else { t.dead = true; continue; }
    }
    for (const e of room.enemies) {
      if (e.dead || t.hitSet.has(e)) continue;
      if (dist2(t.x, t.y, e.x, e.y) < (t.r + e.r) * (t.r + e.r)) {
        t.hitSet.add(e);
        if (t.bombTear) { explode(t.x, t.y, 68, t.damage * 2.2, { harmPlayer: false }); t.dead = true; break; }
        damageEnemy(e, t.damage, { source: "tear", hitPos: { x: t.x, y: t.y } });
        applyTearStatuses(e, t, t);
        fireEvent("hit", { enemy: e, tear: t, damage: t.damage });
        if (t.explosive) { explode(t.x, t.y, t.explosiveRadius, t.damage * 1.2, { harmPlayer: false }); t.dead = true; break; }
        if (t.split > 0) {
          t.split--;
          for (let i = 0; i < 2; i++) spawnPlayerTear(t.x, t.y, t.angle + rand(-1.1, 1.1), { damageMult: 0.45, range: 2.4, sizeMult: 0.65 });
        }
        if (t.pierce > 0) t.pierce--; else { t.dead = true; break; }
      }
    }
  }
  G.tears = G.tears.filter((t) => !t.dead);
  for (const b of G.beams) {
    b.life--;
    if (b.brimstone) {
      buildBrimstonePath(b);
      b.tickTimer--;
      if (b.tickTimer <= 0) applyBrimstoneTick(b);
      continue;
    }
    for (const e of room.enemies) {
      if (e.dead || b.hits.has(e)) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      const proj = clamp(dx * Math.cos(b.angle) + dy * Math.sin(b.angle), 0, b.length);
      const px = b.x + Math.cos(b.angle) * proj, py = b.y + Math.sin(b.angle) * proj;
      if (dist(px, py, e.x, e.y) < e.r + b.width * 0.55) {
        b.hits.add(e);
        damageEnemy(e, b.damage, { source: b.tech ? "tech" : "laser" });
        applyTearStatuses(e, { poison: 0.12 }, b);
      }
    }
  }
  G.beams = G.beams.filter((b) => b.life > 0);
}

function updateEnemies() {

function updateAuras() {

    for (const e of G.room.enemies) if (!e.dead && dist(P.x, P.y, e.x, e.y) < (a.radius || 60) + e.r) damageEnemy(e, a.damage || 3, { source: "aura" });

function updateParticles() {

  G.particles = G.particles.filter((p) => p.life > 0);
  for (const f of G.floatTexts) { f.y += f.vy; f.vy *= 0.96; f.life--; }

  for (const e of G.explosions) e.life--;

    G.shakeTime--;

function updatePickups() {

  for (const p of G.room.pickups) {

    p.bob += 0.05;
    if (p.cool > 0) p.cool--;

function purchasePickup(p) {

function wrapCanvasText(text, maxWidth, font) {

function openMap() {
  if (!G) return;

  for (let y = 0; y < 9; y++) {

      const r = floor.rooms.get(roomKey(x, y));
      if (!r) { cells.push(`<div class="map-cell" style="opacity:0"></div>`); continue; }
      const known = floor.explored.has(r.key) || floor.mapReveal || (floor.specialReveal && ["treasure", "shop", "boss", "secret", "devil", "angel"].includes(r.type));
      if (!known) { cells.push(`<div class="map-cell"></div>`); continue; }
      const cur = r.key === G.room.key ? " cur" : "";
      const icon = ROOM_TYPES[r.type] && ROOM_TYPES[r.type].icon ? ROOM_TYPES[r.type].icon : "";
      const teleport = r.visited ? " teleportable" : "";
      const loot = roomLootCount(r);
      const lootBadge = loot > 0 ? `<span class="map-loot">${loot > 9 ? "9+" : loot}</span>` : "";
      cells.push(`<div class="map-cell seen ${r.type}${cur}${teleport}${loot > 0 ? " has-loot" : ""}" data-map-key="${r.key}" title="${ROOM_TYPES[r.type].name}${r.visited ? " · 点击传送" : ""}">${icon}${lootBadge}</div>`);

function triggerVictory() {
  if (!G || G.state === "victory") return;
  G.state = "victory";
  if (!G._victoryRecorded) {
    G._victoryRecorded = true;
    const clears = loadClears();
    clears[G.charId] = (Number(clears[G.charId]) || 0) + 1;
    saveClears(clears);
  }
  Audio.win();
  showEnd(true);
}

/* =====================================================================
 * 22. 主循环
 * ===================================================================== */
function updateGame() {
  if (!G || G.state !== "playing") return;
  G.frame++;
  G.time += 1 / 60;
  if (G.floorTitle > 0) G.floorTitle--;
  if (G.messageTimer > 0) G.messageTimer--;
  if (G.victoryPending > 0) {
    G.victoryPending--;
    if (G.victoryPending <= 0) { triggerVictory(); return; }
  }
  updateTimers();
  updatePlayer();
  if (G.state !== "playing") return;
  updateEnemies();
  if (G.player.dead && G.state === "playing") killPlayer();
}

function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(100, ts - lastTime);
  lastTime = ts;
  accumulator += dt;
  let steps = 0;
  while (accumulator >= 1000 / 60 && steps < 5) {
    updateGame();
    accumulator -= 1000 / 60;
    steps++;
  }
  render();
  // 不在这里清空 Pressed：事件可能在 update 与 render 之间到达。
  // wasPressed() 会在消费后自行清除，避免偶发按键丢失。
  requestAnimationFrame(loop);
}

function boot() {
  bindInput();
  showTitle();
  requestAnimationFrame(loop);
}

/* =====================================================================
 * 23. 测试 API / 启动
 * ===================================================================== */
if (typeof window !== "undefined") {
  window.__ISAAC__ = {
    ITEMS, ITEM_ORDER, TRINKETS, TRINKET_ORDER, CARDS, CARD_ORDER, PILLS, PILL_ORDER,
    CHARACTERS, CHAPTERS, TRANSFORMS, ENEMY_TYPES, BOSS_DEFS, ROOM_LAYOUTS,
    createRun, startRun, generateFloor, enterRoom, recalcStats, fireEvent, runEffects,
    damageEnemy, spawnEnemy, spawnBoss, spawnPlayerTear, spawnPickup, damagePlayer: takeDamage,
    nextFloor, triggerVictory, addItem, addTrinket, tryPedestal, collectPickup, revealMap, reroll,
    openBombDoorNear, useConsumable, useActive, dropBomb, circleHitsSolid, tearHitsSolid, addConsumable,
    roomLootCount, getState: () => G, Keys, Pressed,
    step: (n = 1) => { for (let i = 0; i < n; i++) updateGame(); },
    renderOnce: () => render(),
    setMenu: (c, d, s) => { menuState = { char: c || "isaac", difficulty: d || "normal", seed: s || "" }; },
    reset: () => { G = null; },
    updateGame,
    procChance,
    isHeadless: IS_HEADLESS,
  };
}

if (!IS_HEADLESS && typeof window !== "undefined" && typeof requestAnimationFrame !== "undefined") {
  boot();
}
</script>

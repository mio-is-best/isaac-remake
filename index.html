<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0709">
<title>以撒的结合：重生 · 网页复刻</title>
<style>:root{
  --bg:#070508;
  --panel:#100b10;
  --panel2:#171016;
  --ink:#e9ddc9;
  --dim:#9c8d83;
  --red:#b5323d;
  --red2:#e05a55;
  --gold:#d9b86c;
  --soul:#7fc8df;
  --line:#3a252b;
  --good:#8ccf7e;
  --bad:#e05a55;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:
  radial-gradient(circle at 50% 20%,#1b0d12 0,#09060a 55%,#030203 100%);
  color:var(--ink);font-family:"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(97vw,calc(96vh * 960 / 680));aspect-ratio:960/680;
  background:#050305;box-shadow:0 0 0 1px #2b171d,0 24px 80px #000,0 0 90px #2a0a11 inset;
  overflow:hidden;border-radius:4px}
#game{display:block;width:100%;height:100%;image-rendering:auto;background:#08060a}
#overlay{position:absolute;inset:0;overflow:auto;background:
  radial-gradient(circle at 50% 18%,rgba(60,20,27,.52),rgba(4,3,5,.94) 62%,#030203 100%);
  backdrop-filter:blur(2px);padding:clamp(12px,2.2vw,30px);scrollbar-width:thin}
#overlay.hidden{display:none}
#overlay::-webkit-scrollbar{width:6px;height:6px}
#overlay::-webkit-scrollbar-track{background:#080508}
#overlay::-webkit-scrollbar-thumb{background:#3b2429;border-radius:3px}
html,body{scrollbar-width:none}
#overlay::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}
#toast{position:absolute;left:50%;bottom:clamp(14px,4vh,44px);transform:translateX(-50%);
  max-width:86%;padding:10px 18px;border:1px solid #5b333a;background:rgba(12,8,11,.94);
  color:#f1e4d0;border-radius:3px;font-size:clamp(12px,1.7vh,16px);letter-spacing:.04em;
  box-shadow:0 8px 30px #000,0 0 20px rgba(181,50,61,.15);z-index:9;text-align:center}
#toast.hidden{display:none}

/* ---------- generic ---------- */
.hidden{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:Consolas,"SFMono-Regular",Meiryo,monospace}
.dim{color:var(--dim)}
.red{color:var(--red2)}
.gold{color:var(--gold)}
.soul{color:var(--soul)}
.good{color:var(--good)}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:38px;padding:8px 18px;border:1px solid #553239;border-radius:2px;
  background:linear-gradient(180deg,#1a1015,#0e0a0d);color:#eadfce;letter-spacing:.08em;
  transition:border-color .12s,background .12s,transform .12s;text-shadow:0 1px 0 #000}
.btn:hover{border-color:#a34a4d;background:linear-gradient(180deg,#28151b,#130c10)}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:#7d323b;background:linear-gradient(180deg,#3a141b,#1a0b10)}
.btn.primary:hover{border-color:#d0645c;background:linear-gradient(180deg,#501b24,#220d13)}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:30px;padding:4px 10px;font-size:12px}
.icon-btn{width:34px;height:34px;padding:0;border:1px solid #4b2c33;background:#110b0e;border-radius:2px}
.kbd{display:inline-block;padding:1px 6px;border:1px solid #4a3037;border-bottom-color:#2a181d;
  border-radius:3px;background:#171014;color:#d9c9b7;font-family:Consolas,monospace;font-size:.88em}

/* ---------- title ---------- */
.menu{position:relative;width:min(980px,100%);min-height:100%;margin:0 auto;display:flex;
  flex-direction:column;justify-content:center;padding:clamp(4px,2vh,20px) 0}
.title-wrap{text-align:center;margin-bottom:clamp(8px,2.4vh,24px)}
.eyebrow{font-size:clamp(9px,1.4vh,12px);letter-spacing:.42em;color:#8f6d68;text-transform:uppercase;margin-bottom:8px}
.game-title{font-family:Georgia,"Noto Serif SC",serif;font-weight:700;letter-spacing:.1em;
  font-size:clamp(25px,6.2vh,54px);line-height:1.06;color:#f0dfc8;
  text-shadow:0 2px 0 #351218,0 0 26px rgba(181,50,61,.45),0 0 80px rgba(100,20,30,.35)}
.game-title .sub{display:block;font-size:.42em;letter-spacing:.32em;color:#b87a6e;margin-top:9px;font-weight:400}
.title-rule{width:min(480px,80%);height:1px;margin:12px auto 0;
  background:linear-gradient(90deg,transparent,#6d343b 25%,#b06d5d 50%,#6d343b 75%,transparent)}
.menu-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,32%);gap:clamp(10px,2vw,24px);
  align-items:stretch}
.panel{border:1px solid #3a252b;background:linear-gradient(165deg,rgba(23,15,19,.96),rgba(9,6,9,.96));
  box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 1px #0b0709 inset;border-radius:3px;padding:clamp(10px,1.7vw,18px)}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:clamp(11px,1.7vh,14px);letter-spacing:.16em;color:#c7a990;padding-bottom:8px;margin-bottom:10px;
  border-bottom:1px solid #2e1e24}
.char-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.char-card{position:relative;border:1px solid #39262c;background:#0d090c;border-radius:3px;
  padding:8px 5px 7px;text-align:center;transition:.12s;min-height:98px}
.char-card:hover{border-color:#8b454b;background:#160d11;transform:translateY(-1px)}
.char-card.sel{border-color:#cf7466;background:linear-gradient(180deg,#271318,#110a0d);
  box-shadow:0 0 18px rgba(181,50,61,.22) inset,0 0 0 1px rgba(207,116,102,.18)}
.char-card .portrait{height:38px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
.char-card .cname{font-size:clamp(10px,1.5vh,13px);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-card .ctag{font-size:9px;color:#8d7672;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-card .cclears{position:absolute;top:3px;right:4px;font-size:7px;line-height:1;color:#c9a66c;
  background:rgba(8,5,8,.7);border:1px solid rgba(120,85,60,.45);border-radius:2px;padding:2px 3px;white-space:nowrap}
.char-card.sel .cclears{color:#efd39a;border-color:#8d6046}
.char-card.locked{opacity:.35;filter:grayscale(1)}
.char-detail{margin-top:10px;padding-top:9px;border-top:1px dashed #332026;min-height:52px;font-size:clamp(10px,1.45vh,13px);
  color:#b7a496;line-height:1.55}
.char-detail b{color:#e1cdb4;font-weight:600}
.setup-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.seed-input{flex:1;min-width:120px;background:#0a0709;border:1px solid #3b282e;color:#cfbca8;
  padding:8px 10px;border-radius:2px;font-family:Consolas,monospace;font-size:13px;outline:none}
.seed-input:focus{border-color:#855048}
.diff-toggle{display:flex;border:1px solid #3b282e;border-radius:2px;overflow:hidden}
.diff-toggle button{border:0;background:#0d090c;padding:8px 12px;font-size:12px;color:#8f7c73}
.diff-toggle button.on{background:#2b141a;color:#efd7c2}
.menu-actions{display:flex;gap:9px;margin-top:12px;align-items:center;flex-wrap:wrap}
.menu-actions .btn.primary{flex:1;min-width:140px;font-size:clamp(14px,2.1vh,18px);letter-spacing:.2em;min-height:46px}
.side-list{display:flex;flex-direction:column;gap:9px;font-size:clamp(10px,1.5vh,13px);color:#a99487;line-height:1.6}
.side-list .row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #2a1b21;padding-bottom:6px}
.side-list .row:last-child{border-bottom:0}
.side-list b{color:#ddc7ad;font-weight:600}
.controls-mini{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:clamp(9px,1.4vh,12px)}
.controls-mini span:nth-child(odd){color:#c7ad93}
.footnote{text-align:center;color:#5f4b4b;font-size:10px;letter-spacing:.08em;margin-top:clamp(8px,2vh,18px);line-height:1.6}

/* ---------- overlay screens ---------- */
.screen{width:min(880px,100%);min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
.screen-head{text-align:center;margin-bottom:10px}
.screen-head .kicker{font-size:10px;letter-spacing:.38em;color:#8e6c66;text-transform:uppercase}
.screen-head h2{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(24px,5vh,40px);letter-spacing:.12em;
  color:#f0dfc8;margin-top:5px;text-shadow:0 0 28px rgba(181,50,61,.3)}
.screen-head p{color:#a28d81;font-size:13px;margin-top:7px;line-height:1.65}
.screen-foot{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.big-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* inventory */
.inv-layout{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(250px,.68fr);gap:14px}
.inv-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px;align-content:start;
  max-height:46vh;overflow:auto;padding-right:4px}
.inv-item{position:relative;aspect-ratio:1;border:1px solid #3c282e;background:#0d090c;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:24px;cursor:help;transition:.12s}
.inv-item:hover{border-color:#b7685e;background:#1a0f13;transform:translateY(-1px)}
.inv-item .q{position:absolute;right:3px;bottom:1px;font-size:8px;color:#7b6661;font-family:Consolas,monospace}
.inv-item .nm{position:absolute;left:0;right:0;bottom:-1px;font-size:7px;text-align:center;color:#b49d8e;
  background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden}
.stat-table{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px;color:#ad998a}
.stat-table b{color:#e3d0b8;font-family:Consolas,monospace;font-weight:400}
.stat-table .sep{grid-column:1/-1;height:1px;background:#2c1b21;margin:4px 0}
.inv-desc{margin-top:10px;padding:9px;border:1px solid #2f1e24;background:#0a0709;min-height:64px;
  font-size:12px;line-height:1.6;color:#b8a496}
.inv-desc b{color:#e4ceb4}
.tag-list{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:9px;padding:2px 5px;border:1px solid #433037;border-radius:2px;color:#967f78}
.inv-section{margin-top:8px}

/* compendium */
.compendium .inv-layout{grid-template-columns:minmax(0,1.45fr) minmax(240px,.55fr)}
.comp-toolbar{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.comp-search{width:100%;flex:none}
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.filter-chip{border:1px solid #3b282e;background:#0d090c;color:#948079;padding:4px 9px;
  border-radius:2px;font-size:11px;cursor:pointer}
.filter-chip.on{border-color:#a45a55;background:#28141a;color:#edcfb5}
.compendium .comp-list{max-height:calc(100vh - 270px);min-height:180px;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.comp-item .nm{font-size:7px;height:10px;line-height:10px}
.comp-detail{min-height:260px}
.comp-art{font-size:54px;text-align:center;line-height:1.15;margin-top:6px;filter:drop-shadow(0 0 12px rgba(220,180,120,.2))}
.comp-name{text-align:center;font-family:Georgia,"Noto Serif SC",serif;font-size:20px;color:#eed9bd;margin-top:5px}
.comp-en{text-align:center;font-size:10px;color:#806d68;letter-spacing:.08em;margin-top:2px}
.comp-meta{text-align:center;font-size:11px;color:#c2a27f;margin-top:7px}
.compendium .inv-items{scrollbar-width:thin}
.console-note{font-size:11px;line-height:1.65;color:#b9a18e;border:1px dashed #4a3138;
  background:#0a0709;padding:9px;border-radius:2px}
.console-count{margin-top:12px;padding-top:10px;border-top:1px solid #3a252b;
  font-size:11px;color:#d8bd8a;font-family:Consolas,monospace}
.console-item.owned{border-color:#7c9d67;box-shadow:0 0 0 1px rgba(124,157,103,.2) inset}
.console-item.owned::after{content:"✓";position:absolute;left:3px;top:2px;font-size:9px;color:#9fd18b}
.console-screen .comp-list{max-height:calc(100vh - 360px);min-height:150px}

/* map */
.map-wrap{display:flex;justify-content:center;align-items:center;min-height:0;padding:10px;
  border:1px solid #2f1e24;background:rgba(6,4,6,.7)}
.map-grid{display:grid;gap:5px}
.map-cell{width:100%;height:auto;aspect-ratio:1;min-width:0;border:1px solid #2f2026;background:#0c080b;
  border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.8vh,15px);
  color:#66555a;position:relative;overflow:hidden}
.map-cell.seen{background:#1a1115;border-color:#5a3a40;color:#c7a98f}
.map-cell.teleportable{cursor:pointer;background:#1e1318;border-color:#6b4a46}
.map-cell.teleportable:hover{border-color:#e0b978;background:#2a181c;box-shadow:0 0 10px rgba(224,185,120,.22)}
.map-loot{position:absolute;right:1px;bottom:1px;font-size:9px;line-height:1;color:#f0d98a;
  background:rgba(8,5,8,.85);border-radius:2px;padding:1px 3px;font-family:Consolas,monospace}
.map-cell.has-loot{box-shadow:inset 0 -2px 0 #d9b86c}
.map-cell.cur{border-color:#e5a47f;box-shadow:0 0 12px rgba(220,150,110,.35);background:#2a151a}
.map-cell.boss{color:#df746a}
.map-cell.treasure{color:#e5c66e}
.map-cell.shop{color:#9dd3a2}
.map-cell.secret{color:#b89be0}
.map-cell.angel{color:#d9e8ff}
.map-cell.devil{color:#ff6b62}
.map-cell.door::after{content:"";position:absolute;width:6px;height:2px;background:#6c4a4a}
.map-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:10px;color:#9b8780;margin-top:10px}

/* end */
.end-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.end-stat{border:1px solid #332228;background:#0c080b;padding:9px;text-align:center}
.end-stat .v{font-family:Consolas,monospace;font-size:clamp(18px,3.3vh,28px);color:#e8d5bd}
.end-stat .l{font-size:9px;letter-spacing:.15em;color:#8f7b73;margin-top:2px}
.end-quote{text-align:center;color:#b7a08e;font-size:13px;line-height:1.8;margin:10px 0;font-style:italic}
.victory h2{color:#f4dfb0;text-shadow:0 0 40px rgba(217,184,108,.38)}
.death h2{color:#d96b64}

/* help */
.help-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.help-block{font-size:12px;color:#b49f91;line-height:1.7}
.help-block h3{font-size:12px;letter-spacing:.14em;color:#d7bca3;margin:0 0 7px;font-weight:600}
.help-block p{margin:0 0 7px}
.help-keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.badge{display:inline-block;border:1px solid #523038;background:#171014;color:#cbb39d;
  font-size:10px;padding:2px 6px;border-radius:2px;margin-right:4px}
hr.sep{border:0;border-top:1px solid #2d1d23;margin:10px 0}

/* responsive */
@media (max-width:760px){
  .menu-grid{grid-template-columns:1fr}
  .side-panel{display:none}
  .char-grid{grid-template-columns:repeat(4,1fr)}
  .inv-layout{grid-template-columns:1fr}
  .inv-items{max-height:30vh}
  .help-grid{grid-template-columns:1fr}
  .end-stats{grid-template-columns:repeat(2,1fr)}
  .screen{justify-content:flex-start;padding-top:6px}
  .menu{justify-content:flex-start}
}
@media (max-width:440px){
  #overlay{padding:8px}
  .char-grid{grid-template-columns:repeat(4,1fr);gap:4px}
  .char-card{padding:5px 2px;min-height:82px}
  .char-card .portrait{height:30px}
  .char-card .ctag{display:none}
  .title-wrap{margin-bottom:8px}
  .game-title{letter-spacing:.05em}
  .panel{padding:9px}
  .setup-row{margin-top:7px}
  .menu-actions .btn.primary{min-height:40px}
  .footnote{font-size:9px}
}
@media (max-height:560px){
  .menu{justify-content:flex-start}
  .title-wrap{margin-bottom:6px}
  .game-title{font-size:26px}
  .char-card{min-height:80px}
  .char-detail{display:none}
  .footnote{display:none}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="960" height="680" aria-label="游戏画面"></canvas>
  <div id="overlay" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<script>/* ---- 00_core.js ---- */

"use strict";
/* =====================================================================
 * 以撒的结合：重生 · 网页复刻
 * 模块化源码由 tools/build.mjs 合并为单文件 index.html。
 * 核心原则：道具只描述属性/标签/触发器/效果，组合由通用管线结算。
 * ===================================================================== */

/* ----------------------------- 0. 基础工具 ----------------------------- */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const IS_HEADLESS = typeof window !== "undefined" && !!window.__HEADLESS__;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; };
const angleDiff = (a, b) => { let d = (b - a + Math.PI) % TAU; if (d < 0) d += TAU; return d - Math.PI; };
const lerpAngle = (a, b, t) => a + angleDiff(a, b) * t;
const fmt = (n, d = 1) => (Number.isFinite(n) ? n.toFixed(d) : "0.0");
const pct = (n) => Math.round(clamp(n, 0, 1) * 100) + "%";
const deepCopy = (o) => JSON.parse(JSON.stringify(o));
const hashStr = (str) => {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
};
let RNG_STATE = 0x9e3779b9;
let RNG_SEED = 0;
function srand(seed) {
  RNG_SEED = typeof seed === "number" ? seed >>> 0 : hashStr(String(seed));
  RNG_STATE = RNG_SEED || 0x9e3779b9;
}
function rng() {
  RNG_STATE |= 0;
  RNG_STATE = (RNG_STATE + 0x6d2b79f5) | 0;
  let t = RNG_STATE;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rnd = rng;
const rand = (a, b) => a + rng() * (b - a);
const randInt = (a, b) => Math.floor(a + rng() * (b - a + 1));
const chance = (p) => rng() < p;
const pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];
const pickN = (arr, n) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, Math.max(0, Math.min(n, a.length)));
};
const weightedPick = (arr, weightFn) => {
  let total = 0;
  for (const x of arr) total += Math.max(0, weightFn(x));
  if (total <= 0) return arr.length ? pick(arr) : null;
  let roll = rng() * total;
  for (const x of arr) { roll -= Math.max(0, weightFn(x)); if (roll <= 0) return x; }
  return arr[arr.length - 1];
};
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function clampAngle(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }

/* ----------------------------- 1. 画布与输入 ----------------------------- */
const canvas = typeof document !== "undefined" ? document.getElementById("game") : null;
const ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
const overlayEl = typeof document !== "undefined" ? document.getElementById("overlay") : null;

const VIEW_W = 960, VIEW_H = 680, TILE = 64, ROOM_W = 13, ROOM_H = 7;
const ARENA_W = TILE * ROOM_W, ARENA_H = TILE * ROOM_H;
const ARENA_X = (VIEW_W - ARENA_W) / 2, ARENA_Y = 132;
const ROOM_CENTER_X = ARENA_W / 2, ROOM_CENTER_Y = ARENA_H / 2;

function setCanvasSize() {
  if (!canvas || IS_HEADLESS || !appEl) return;
  const rect = appEl.getBoundingClientRect();
  const scale = Math.min(rect.width / VIEW_W, rect.height / VIEW_H);
  canvas.width = VIEW_W; canvas.height = VIEW_H;
  canvas.style.width = VIEW_W + "px"; canvas.style.height = VIEW_H + "px";
  canvas.style.transformOrigin = "top left"; canvas.style.transform = `scale(${scale})`;
  canvas.style.position = "absolute";
  canvas.style.left = Math.max(0, (rect.width - VIEW_W * scale) / 2) + "px";
  canvas.style.top = Math.max(0, (rect.height - VIEW_H * scale) / 2) + "px";
  if (overlayEl) {
    overlayEl.style.width = VIEW_W + "px"; overlayEl.style.height = VIEW_H + "px";
    overlayEl.style.transformOrigin = "top left"; overlayEl.style.transform = `scale(${scale})`;
    overlayEl.style.left = canvas.style.left; overlayEl.style.top = canvas.style.top;
    overlayEl.style.right = "auto"; overlayEl.style.bottom = "auto";
  }
}

const Keys = Object.create(null);
const Pressed = Object.create(null);
const Input = { mouseX: VIEW_W / 2, mouseY: VIEW_H / 2, mouseDown: false, mouseClicked: false, anyKey: false };
function bindInput() {
  if (IS_HEADLESS || typeof window === "undefined" || !canvas) return;
  const prevented = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab", "KeyE", "KeyQ", "KeyI", "KeyM", "Backquote"]);
  window.addEventListener("keydown", (e) => {
    if (prevented.has(e.code)) e.preventDefault();
    if (!Keys[e.code]) Pressed[e.code] = true;
    Keys[e.code] = true; Input.anyKey = true; Audio.unlock();
    if (e.code === "Escape") onEscape();
    else if (e.code === "Tab" && G && G.state === "playing") { Pressed.Tab = false; openMap(); }
    else if (e.code === "KeyI" && G && (G.state === "playing" || G.state === "paused")) { Pressed.KeyI = false; if (G.state === "inventory") resumeGame(); else openInventory(); }
    else if (e.code === "Backquote" && G) {
      Pressed.Backquote = false;
      if (G.state === "console") resumeGame();
      else if (G.state === "playing") openConsole();
    }
    else if (e.code === "KeyM") { Audio.toggleMute(); toast(Audio.muted ? "已静音" : "声音开启", 900); }
  });
  window.addEventListener("keyup", (e) => { Keys[e.code] = false; });
  window.addEventListener("blur", () => { for (const k in Keys) Keys[k] = false; Input.mouseDown = false; });
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    Input.mouseX = (e.clientX - rect.left) * (VIEW_W / rect.width);
    Input.mouseY = (e.clientY - rect.top) * (VIEW_H / rect.height);
  });
  canvas.addEventListener("mousedown", (e) => { if (e.button === 0) { Input.mouseDown = true; Input.mouseClicked = true; Audio.unlock(); } });
  window.addEventListener("mouseup", (e) => { if (e.button === 0) Input.mouseDown = false; });
  window.addEventListener("resize", setCanvasSize);
  setCanvasSize();
}
function wasPressed(code) { if (Pressed[code]) { Pressed[code] = false; return true; } return false; }
function clearPressed() { for (const k in Pressed) Pressed[k] = false; Input.mouseClicked = false; }
function aimVector() {
  let ax = 0, ay = 0;
  if (Keys.ArrowLeft) ax -= 1; if (Keys.ArrowRight) ax += 1;
  if (Keys.ArrowUp) ay -= 1; if (Keys.ArrowDown) ay += 1;
  if (ax || ay) { const n = norm(ax, ay); return { x: n.x, y: n.y, angle: Math.atan2(n.y, n.x), mouse: false }; }
  if (Input.mouseDown && G && G.player) {
    const mx = Input.mouseX - ARENA_X, my = Input.mouseY - ARENA_Y;
    const n = norm(mx - G.player.x, my - G.player.y);
    return { x: n.x, y: n.y, angle: Math.atan2(n.y, n.x), mouse: true };
  }
  return null;
}
function wantsFire() { return !!(Keys.ArrowLeft || Keys.ArrowRight || Keys.ArrowUp || Keys.ArrowDown || Input.mouseDown); }

const Audio = {
  ctx: null, muted: false, master: null,
  unlock() {
    if (this.ctx || IS_HEADLESS || typeof window === "undefined") return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.18; this.master.connect(this.ctx.destination); } catch (_) { this.ctx = null; }
  },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.18; },
  tone(freq, dur, type = "sine", vol = 0.05, slide = 0) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur, vol = 0.05, filter = 800) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filter;
      const g = this.ctx.createGain(); g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
    } catch (_) {}
  },
  shoot() { this.tone(540, 0.06, "sine", 0.028, -260); },
  laser() { this.tone(220, 0.28, "sawtooth", 0.05, -100); this.noise(0.16, 0.03, 1800); },
  hit() { this.tone(180, 0.05, "square", 0.025, -60); },
  hurt() { this.tone(110, 0.25, "sawtooth", 0.07, -60); this.noise(0.18, 0.035, 500); },
  pickup() { this.tone(740, 0.08, "triangle", 0.04, 220); },
  coin() { this.tone(980, 0.06, "triangle", 0.035, 160); setTimeout(() => this.tone(1320, 0.07, "triangle", 0.03), 45); },
  key() { this.tone(660, 0.08, "square", 0.03, 120); },
  heal() { this.tone(520, 0.12, "sine", 0.04, 200); setTimeout(() => this.tone(780, 0.15, "sine", 0.035, 120), 80); },
  explosion() { this.noise(0.5, 0.14, 300); this.tone(65, 0.4, "sawtooth", 0.08, -30); },
  door() { this.tone(120, 0.18, "square", 0.04, 40); },
  boss() { this.tone(55, 1.1, "sawtooth", 0.07, -10); this.tone(82, 0.9, "sine", 0.04); },
  death() { this.tone(160, 1.2, "sawtooth", 0.08, -120); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.5, "sine", 0.05), i * 180)); },
  error() { this.tone(130, 0.09, "square", 0.04, -20); },
};

function defineItem(id, name, en, type, quality, pool, art, desc, opt = {}) {
  if (ITEMS[id]) throw new Error("duplicate item id: " + id);
  const it = { id, name, en, type, quality, pool, art, desc, tags: [], mods: {}, flags: [], procs: [], tear: {}, pickupEffects: [], active: null, familiar: null, orbital: null, trail: null, aura: null, hearts: 0, stackable: false };
  Object.assign(it, opt);
  if (typeof it.pool === "string") it.pools = [it.pool];
  else if (Array.isArray(it.pool)) it.pools = it.pool.slice();
  else it.pools = [];
  if (!it.pools.length) it.pools = ["treasure"];
  ITEMS[id] = it; ITEM_ORDER.push(it); return it;
}
function defineTrinket(id, name, en, art, desc, opt = {}) {
  const t = { id, name, en, art, desc, tags: [], mods: {}, flags: [], procs: [], tear: {} };
  Object.assign(t, opt); TRINKETS[id] = t; TRINKET_ORDER.push(t); return t;
}

function definePill(id, name, en, art, desc, effects, weight = 1) { PILLS[id] = { id, name, en, art, desc, effects, weight }; PILL_ORDER.push(PILLS[id]); return PILLS[id]; }

let G = null;
let lastTime = 0;
let accumulator = 0;
let menuState = { char: "isaac", difficulty: "normal", seed: "" };

function getSourceMods(src, target, mult) {
  if (!src.mods) return;
  for (const k in src.mods) {
    const v = src.mods[k];
    if (!Number.isFinite(v)) continue;
    if (k.endsWith("Mult")) target[k.slice(0, -4)] = (target[k.slice(0, -4)] || 1) * v;
    else target[k] = (target[k] || 0) + v;
  }
}

function recalcStats() {
  if (!G || !G.player) return null;

  // 角色 base 是相对基础值的修正（例如该隐 +3 射程、抹大拉 -0.45 移速），
  // 不是整组覆盖，否则未列出的属性会丢失。
  const s = Object.assign({}, BASE_STATS);
  for (const k in (P.char.base || {})) {
    const v = P.char.base[k];
    if (Number.isFinite(v)) s[k] = (s[k] || 0) + v;
  }
  const mult = { damage: 1, fireDelay: 1, speed: 1, range: 1, shotSpeed: 1, tearSize: 1 };
  const flags = new Set(), procs = [], tear = {}, orbitals = [], familiars = [], trails = [], auras = [], tags = Object.create(null);
  const addSource = (src, kindLabel, uid) => {

    const source = Object.assign({}, src, { _uid: uid || src.id });
    for (const t of source.tags || []) tags[t] = (tags[t] || 0) + 1;

        else if (Number.isFinite(v)) {

    const id = P.items[i];

        Audio.tone(392, 0.25, "sine", 0.06, 160);

    }
  }

  for (const m of P.permaMods || []) {
    for (const k in m) {
      if (k.endsWith("Mult")) mult[k.slice(0, -4)] = (mult[k.slice(0, -4)] || 1) * m[k];
      else s[k] = (s[k] || 0) + m[k];
    }
  }
  for (const t of P.tempMods || []) {
    if (t.expired) continue;
    if (t.untilFrame > 0 && G.frame > t.untilFrame) { t.expired = true; continue; }
    if (t.untilRoom != null && t.untilRoom < G.roomSerial) { t.expired = true; continue; }
    for (const k in t.mods) {
      if (k.endsWith("Mult")) mult[k.slice(0, -4)] = (mult[k.slice(0, -4)] || 1) * t.mods[k];

    else if (allTear.burn > 0) allTear.color = "#ed8452";
    else if (allTear.freeze > 0) allTear.color = "#a6e4f2";

    else if (allTear.slow > 0) allTear.color = "#9eb7c9";

  const brimstoneItems = P.items.filter((id) => id === "brimstone").length;

  P.flying = flags.has("flying") || !!P.char.flying;
  P.maxRed = Math.max(0, P.maxRed);
  if (P.active && ITEMS[P.active.id]) {

}

function rebuildFamiliarsAndOrbitals() {

/* --- 生命 / 拾取 --- */
function addContainers(amount, fill = true) {
  const P = G.player;

  P.red = clamp(P.red, 0, P.maxRed);
}
function healPlayer(amount) {

function addSoul(amount) { const P = G.player; P.soul = Math.max(0, P.soul + amount); if (amount > 0) floatText(P.x, P.y - 24, "+" + amount / 2 + "💙", "#8fd6ef"); }
function addBlack(amount) { const P = G.player; P.black = Math.max(0, P.black + amount); if (amount > 0) floatText(P.x, P.y - 24, "+" + amount / 2 + "🖤", "#b59adf"); }

function addItem(id, opts = {}) {

/* --- 效果解释器 --- */
function runEffects(effects, context = {}) {

    case "fullHeal": P.red = P.maxRed; spawnHealParticles(P.x, P.y, 18); break;
    case "convertSoulToRed": {

    case "damage": if (targetEnemy) damageEnemy(targetEnemy, amount, { source: "effect" }); break;

function procChance(base, luck) { return clamp((base || 0) + (luck || 0) * 0.01, 0, 0.95); }
function procAllowed(proc, ctx) {

  if (cond.roomType && G.room.type !== cond.roomType) return false;
  if (cond.hpBelow != null && P.red + P.soul + P.black > cond.hpBelow) return false;
  if (cond.tag && !(P.tags[cond.tag] > 0)) return false;

}
function fireEvent(eventName, context = {}) {

  if (G.state === "dead" || G.state === "victory") { if (eventName !== "death") return; }
  const P = G.player, procs = P.procs || [];
  for (let i = 0; i < procs.length; i++) {
    const proc = procs[i];
    if (proc.on !== eventName) continue;
    if (proc.sourceKind === "transform" && !P.transforms.has(proc.source.id)) continue;
    if (!procAllowed(proc, context)) continue;
    const key = (proc.source._uid || proc.source.id || "src") + ":" + i;
    if (proc.once) {

      const scopeKey = key + ":" + proc.once + ":" + (proc.once === "room" ? G.roomSerial : proc.once === "floor" ? G.floorIndex : "run");
      if (G.procOnce[scopeKey]) continue;

    if (proc.cooldown) {
      G.procCool = G.procCool || Object.create(null);
      const last = G.procCool[key] || -9999;
      if (G.frame - last < proc.cooldown) continue;
      G.procCool[key] = G.frame;
    }
    let cv = proc.chance == null ? 1 : proc.chance;
    if (cv < 1) cv = procChance(cv, P.stats.luck);
    if (cv >= 1 || chance(cv)) runEffects(proc.effects, { ...context, source: proc.source });
  }
}

/* =====================================================================
 * 8. 房间模板 / 楼层生成 / 门 / 清场
 * ===================================================================== */
const ROOM_LAYOUTS = [
  [".............", ".............", ".............", ".............", ".............", ".............", "............."],
  [".............", "..##.....##..", ".............", ".............", ".............", "..##.....##..", "............."],
  [".............", "....P...P....", ".............", ".............", ".............", "....P...P....", "............."],
  [".............", "....#...#....", "....#...#....", ".............", "....#...#....", "....#...#....", "............."],
  [".............", "..oo.....oo..", "..oo.....oo..", ".............", "..oo.....oo..", "..oo.....oo..", "............."],
  [".............", "..f.......f..", ".............", ".............", ".............", "..f.......f..", "............."],
  [".............", "....##.##....", ".............", "......T......", ".............", "....##.##....", "............."],
  [".............", "..#.......#..", "..#..P.P..#..", ".............", "..#..P.P..#..", "..#.......#..", "............."],
  [".............", "....^^^^^....", ".............", ".............", ".............", "....^^^^^....", "............."],
  [".............", ".##.......##.", "...#.....#...", ".............", "...#.....#...", ".##.......##.", "............."],
  [".............", "..#.#...#.#..", ".............", "....P.P.P....", ".............", "..#.#...#.#..", "............."],
  [".............", "...o.....o...", "....#...#....", ".............", "....#...#....", "...o.....o...", "............."],
];
function roomKey(x, y) { return x + "," + y; }

function generateFloor(index) {
  const chapter = CHAPTERS[clamp(index, 0, CHAPTERS.length - 1)];
  const targetCount = clamp(9 + index + randInt(0, 2), 9, 14);
  const rooms = new Map();
  const start = { gx: 4, gy: 4, type: "start", doors: {}, visited: false, cleared: true, init: false, enemies: [], pickups: [], pedestals: [], obstacles: [], hazards: [], decor: [], unlocked: {}, key: roomKey(4, 4) };
  rooms.set(start.key, start);
  let frontier = [start], guard = 0;
  while (rooms.size < targetCount && guard++ < 3000) {
    const base = pick(frontier);
    const dirs = shuffle(DIR_ORDER.slice());
    let added = false;
    for (const d of dirs) {
      const nx = base.gx + DIRS[d].x, ny = base.gy + DIRS[d].y;
      if (nx < 0 || nx > 8 || ny < 0 || ny > 8) continue;
      const key = roomKey(nx, ny);
      if (rooms.has(key)) continue;
      const room = { gx: nx, gy: ny, type: "normal", key, doors: {}, visited: false, cleared: false, init: false, enemies: [], pickups: [], pedestals: [], obstacles: [], hazards: [], decor: [], unlocked: {}, bossSpawned: false, trapdoor: null };
      rooms.set(key, room); frontier.push(room); added = true; break;
    }
    if (!added) frontier.splice(frontier.indexOf(base), 1);
  }
  for (const room of rooms.values()) {
    for (const d of DIR_ORDER) {
      const nb = rooms.get(roomKey(room.gx + DIRS[d].x, room.gy + DIRS[d].y));
      if (nb) room.doors[d] = { to: nb.key };
    }
  }
  const degree = (r) => Object.keys(r.doors).length;
  const distMap = new Map(), queue = [start];
  distMap.set(start.key, 0);
  while (queue.length) {
    const cur = queue.shift();
    for (const d of DIR_ORDER) {
      const nb = cur.doors[d] && rooms.get(cur.doors[d].to);
      if (!nb || distMap.has(nb.key)) continue;
      distMap.set(nb.key, distMap.get(cur.key) + 1); queue.push(nb);
    }
  }
  const candidates = [...rooms.values()].filter((r) => r !== start);
  candidates.sort((a, b) => (distMap.get(b.key) || 0) - (distMap.get(a.key) || 0));
  const deadEnds = candidates.filter((r) => degree(r) === 1);
  const boss = (deadEnds.length ? deadEnds : candidates)[0];
  boss.type = "boss";
  const freeEnds = shuffle(deadEnds.filter((r) => r !== boss && r !== start));
  const assign = (type) => { const r = freeEnds.shift(); if (r) { r.type = type; return r; } return null; };
  assign("treasure"); assign("shop"); assign("secret");
  if (index >= 1 && chance(0.5)) assign("curse");
  if (chance(0.45)) assign("library");
  if (chance(0.4)) assign("sacrifice");
  const floor = { index, chapter, rooms, startRoom: start, bossRoom: boss, explored: new Set([start.key]), mapReveal: false, specialReveal: false, floorKills: 0, floorStartTime: G.time };
  G.floor = floor; G.floorIndex = index;
  G.devilChance = clamp(0.35 + index * 0.06 + (G.player.flags.has("devil_luck") ? 0.12 : 0), 0, 0.95);
  G.angelChance = clamp(0.08 + (index >= 2 ? 0.05 : 0), 0, 0.5);
  G.devilDoorDir = null; G.devilRoom = null; G.tookRedDamage = false;
  G.revealed = { map: false, special: false };
  // 预先初始化整层，让地图能显示每个房间尚未拾取的资源；
  // 敌人/掉落只在房间被访问时更新，不会提前行动。
  for (const room of rooms.values()) if (!room.init) initRoom(room);
  return floor;
}

function roomLootCount(room) {
  if (!room) return 0;
  let n = 0;
  for (const p of room.pickups || []) if (!p.dead) n++;
  for (const ped of room.pedestals || []) if (!ped.taken) n++;

}
function roomItemLootCount(room) {
  if (!room) return 0;
  let n = 0;
  for (const ped of room.pedestals || []) if (!ped.taken) n++;

}

function chooseLayout(room) {
  if (["start", "boss", "treasure", "shop", "devil", "angel"].includes(room.type)) return ROOM_LAYOUTS[0];
  if (room.type === "secret") return pick([ROOM_LAYOUTS[1], ROOM_LAYOUTS[3], ROOM_LAYOUTS[7]]);
  if (room.type === "library") return ROOM_LAYOUTS[3];
  if (room.type === "curse" || room.type === "sacrifice") return ROOM_LAYOUTS[8];
  const base = pick(ROOM_LAYOUTS);

}
function clearRoomTile(room, x, y) {
  if (x < 0 || x >= ROOM_W || y < 0 || y >= ROOM_H) return;
  const idx = room.obstacles.findIndex((o) => o.tx === x && o.ty === y);
  if (idx >= 0) room.obstacles.splice(idx, 1);
  room.solids[y][x] = 0; room.pits[y][x] = 0;
}
function carveDoorPaths(room) {
  const cx = 6, cy = 3;
  for (const c of [{ x: 6, y: 0 }, { x: 6, y: 6 }, { x: 0, y: 3 }, { x: 12, y: 3 }]) {
    let x = cx, y = cy;
    while (x !== c.x) { x += sign(c.x - x); clearRoomTile(room, x, y); }
    while (y !== c.y) { y += sign(c.y - y); clearRoomTile(room, x, y); }
  }
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) clearRoomTile(room, cx + dx, cy + dy);
}

function addRoomObstacle(room, type, tx, ty) {
  const defs = { rock: { hp: 1, solid: true, r: 28 }, poop: { hp: 2, solid: true, r: 24 }, pit: { hp: 0, solid: true, pit: true, r: 26 }, tnt: { hp: 1, solid: true, r: 25 } };
  const d = defs[type] || defs.rock;
  const o = { type, tx, ty, x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE, hp: d.hp, maxHp: d.hp, r: d.r, solid: d.solid, pit: !!d.pit, seed: rng() * 1000, dead: false };
  room.obstacles.push(o);
  room.solids[ty][tx] = d.solid ? 1 : 0;
  if (d.pit) room.pits[ty][tx] = 1;

}
function updateRoomSolidity(room) {
  if (!room.solids) return;
  for (let y = 0; y < ROOM_H; y++) for (let x = 0; x < ROOM_W; x++) { room.solids[y][x] = 0; room.pits[y][x] = 0; }
  for (const o of room.obstacles) {
    if (o.dead) continue;
    if (o.pit) room.pits[o.ty][o.tx] = 1;
    if (o.solid) room.solids[o.ty][o.tx] = 1;
  }

function initRoom(room) {
  if (room.init) return;
  room.init = true;
  const layout = chooseLayout(room);
  room.layout = layout;
  room.solids = Array.from({ length: ROOM_H }, () => new Array(ROOM_W).fill(0));
  room.pits = Array.from({ length: ROOM_H }, () => new Array(ROOM_W).fill(0));
  room.obstacles = []; room.hazards = []; room.enemies = []; room.pickups = []; room.pedestals = []; room.decor = []; room.trapdoor = null;
  for (let y = 0; y < ROOM_H; y++) {

      const ch = (layout[y] || "")[x] || ".";
      if (ch === ".") continue;

      if (ch === "f") { room.hazards.push({ type: "fire", tx: x, ty: y, x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, r: 18, phase: rng() * TAU }); continue; }
      addRoomObstacle(room, ch === "#" ? "rock" : ch === "P" ? "poop" : ch === "o" ? "pit" : ch === "T" ? "tnt" : "rock", x, y);
    }
  }
  carveDoorPaths(room);
  for (let i = 0; i < randInt(4, 10); i++) room.decor.push({ type: chance(0.72) ? "stain" : "crack", x: rand(16, ARENA_W - 16), y: rand(16, ARENA_H - 16), r: rand(7, 26), a: rand(0.08, 0.22), rot: rng() * TAU });
  if (room.type === "treasure") {
    if (G.player.flags.has("options") || G.player.flags.has("more_options")) {
      spawnPedestal(ROOM_CENTER_X - 80, ROOM_CENTER_Y, rollItem("treasure"), { room, choiceGroup: "treasure:" + room.key });
      spawnPedestal(ROOM_CENTER_X + 80, ROOM_CENTER_Y, rollItem("treasure"), { room, choiceGroup: "treasure:" + room.key });
    } else spawnPedestal(ROOM_CENTER_X, ROOM_CENTER_Y, rollItem("treasure"), { room });
    room.cleared = true;
  } else if (room.type === "shop") {
    initShop(room); room.cleared = true;
  } else if (room.type === "secret") {
    spawnPickup(chance(0.5) ? "soul" : "coin", ROOM_CENTER_X - 60, ROOM_CENTER_Y, { room });
    spawnPickup(chance(0.5) ? "key" : "bomb", ROOM_CENTER_X + 60, ROOM_CENTER_Y, { room });
    if (chance(0.35)) spawnPedestal(ROOM_CENTER_X, ROOM_CENTER_Y - 40, rollItem("secret"), { noPrice: true, room });
    room.cleared = true;
  } else if (room.type === "curse") {
    spawnPedestal(ROOM_CENTER_X, ROOM_CENTER_Y, rollItem("curse"), { price: { hearts: 1 }, room });
    for (const [x, y] of [[3, 2], [9, 2], [3, 4], [9, 4]]) if (!room.solids[y][x]) room.hazards.push({ type: "spike", tx: x, ty: y, x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, r: 22, cool: 0 });
    room.cleared = true;
  } else if (room.type === "library") {
    spawnPedestal(ROOM_CENTER_X - 90, ROOM_CENTER_Y, rollItem("library"), { noPrice: true, room });
    spawnPedestal(ROOM_CENTER_X + 90, ROOM_CENTER_Y, rollItem("library"), { noPrice: true, room });
    room.cleared = true;
  } else if (room.type === "sacrifice") {
    spawnPedestal(ROOM_CENTER_X, ROOM_CENTER_Y - 30, rollItem("angel"), { price: { hearts: 1 }, room });
    room.cleared = true;
  } else if (room.type === "boss") {
    // 进入时生成 Boss
  } else if (room.type === "start") {
    room.cleared = true;
  } else {
    spawnRoomEnemies(room, clamp(2 + G.floorIndex + randInt(0, 2), 2, 8));
  }
  updateRoomSolidity(room);
}

function spawnRoomEnemies(room, count) {
  const pool = CHAPTERS[G.floorIndex].enemies, spots = [];
  for (let y = 1; y < ROOM_H - 1; y++) {
    for (let x = 1; x < ROOM_W - 1; x++) {
      if (room.solids[y][x] || room.pits[y][x]) continue;
      const px = (x + 0.5) * TILE, py = (y + 0.5) * TILE;
      if (dist(px, py, ROOM_CENTER_X, ROOM_CENTER_Y) < 90) continue;
      if (px < 110 || px > ARENA_W - 110 || py < 90 || py > ARENA_H - 90) continue;
      spots.push({ x: px, y: py });
    }
  }
  shuffle(spots);
  for (let i = 0; i < Math.min(count, spots.length); i++) spawnEnemy(pick(pool), spots[i].x, spots[i].y, { room });
}
function initShop(room) {
  const slots = [{ x: ROOM_CENTER_X - 190, y: ROOM_CENTER_Y - 52 }, { x: ROOM_CENTER_X + 190, y: ROOM_CENTER_Y - 52 }];
  for (let i = 0; i < slots.length; i++) {
    const item = rollItem("shop");
    let price = 15 + (ITEMS[item] ? ITEMS[item].quality * 2 : 0);
    if (G.player.trinket === "silver_dollar") price = Math.max(3, price - 5);
    spawnPedestal(slots[i].x, slots[i].y, item, { price: { coins: price }, room, shop: true });
  }
  spawnPickup("heart", ROOM_CENTER_X - 110, ROOM_CENTER_Y + 80, { price: { coins: 3 }, room });
  spawnPickup("bomb", ROOM_CENTER_X + 40, ROOM_CENTER_Y + 80, { price: { coins: 5 }, room });
  spawnPickup("key", ROOM_CENTER_X + 150, ROOM_CENTER_Y + 80, { price: { coins: 5 }, room });
}

function poolItems(pool) { let arr = ITEM_ORDER.filter((it) => it.pools.includes(pool)); if (!arr.length) arr = ITEM_ORDER.filter((it) => it.pools.includes("treasure")); return arr; }
function rollItem(pool, opts = {}) {
  const P = G.player;
  let candidates = poolItems(pool);
  if (pool === "library") candidates = ITEM_ORDER.filter((it) => it.type === "active" && (it.tags.includes("book") || it.tags.includes("active")));
  if (P.flags.has("chaos") || pool === "chaos") candidates = ITEM_ORDER.slice();
  let unowned = candidates.filter((it) => !P.items.includes(it.id));
  if (!unowned.length) candidates = ITEM_ORDER.filter((it) => !P.items.includes(it.id));
  if (!candidates.length) candidates = ITEM_ORDER.slice();
  const use = unowned.length ? unowned : candidates;
  const weight = (it) => {
    let w = [0, 1.4, 2.2, 3.2, 4][clamp(it.quality, 1, 4)] || 2;
    if (P.flags.has("sacred_orb")) w = Math.pow(w, 1.8);
    return w;
  };
  return (weightedPick(use, weight) || pick(ITEM_ORDER)).id;
}

function snapCompanionsToPlayer() {
  const P = G.player;
  for (let i = 0; i < G.familiars.length; i++) {
    const f = G.familiars[i];
    f.x = P.x - 38 + (i % 3) * 38;
    f.y = P.y + 34 + Math.floor(i / 3) * 24;
  }
  for (const o of G.orbitals) {
    o.x = P.x + Math.cos(o.angle) * o.radius;
    o.y = P.y + Math.sin(o.angle) * o.radius;
  }
  if (G.friendlies) for (let i = 0; i < G.friendlies.length; i++) {
    const f = G.friendlies[i];
    f.x = P.x + Math.cos(i * 1.7) * 34;
    f.y = P.y + Math.sin(i * 1.7) * 34;
    f.vx = 0; f.vy = 0;
  }
}

function enterRoom(room, opts = {}) {
  if (!room) return;
  const prev = G.room;
  G.room = room; G.currentRoom = room; G.roomSerial++;
  G.procOnce = Object.create(null); G.enemyShots.length = 0; G.beams.length = 0;
  G.tears.length = 0; G.telegraphs.length = 0; G.explosions.length = 0;
  G.creeps = G.creeps.filter((c) => c.persistent); G.bombs = []; G.particles = [];
  G.doorCd = 22; G.trapdoorCharge = 0; G.state = "playing";
  if (prev && prev !== room) {
    for (const m of G.player.tempMods) if (m.untilRoom != null) m.expired = true;
    for (const f of G.player.tempFlags) if (f.untilRoom != null) f.expired = true;
    for (const t of G.player.tempTears) if (t.untilRoom != null) t.expired = true;
  }
  if (!room.init) initRoom(room);
  room.visited = true; G.floor.explored.add(room.key); G.roomsVisited++;
  if (!opts.fromDir) { G.player.x = ROOM_CENTER_X; G.player.y = ROOM_CENTER_Y; }
  else if (opts.fromDir === "n") { G.player.x = ROOM_CENTER_X; G.player.y = ARENA_H - 46; }
  else if (opts.fromDir === "s") { G.player.x = ROOM_CENTER_X; G.player.y = 46; }
  else if (opts.fromDir === "w") { G.player.x = ARENA_W - 46; G.player.y = ROOM_CENTER_Y; }
  else if (opts.fromDir === "e") { G.player.x = 46; G.player.y = ROOM_CENTER_Y; }
  G.player.invuln = Math.max(G.player.invuln || 0, 40);
  G.player.vx = 0; G.player.vy = 0;
  G.player.aim = opts.fromDir === "n" ? -Math.PI / 2 : opts.fromDir === "s" ? Math.PI / 2 : opts.fromDir === "w" ? Math.PI : 0;
  snapCompanionsToPlayer();
  G.enemies = room.enemies;
  G.boss = room.type === "boss" ? room.enemies.find((e) => e.boss) || null : null;
  G.shake = 0; G.roomEnterFlash = 14;
  if (room.type === "boss" && !room.cleared && !room.bossSpawned) {
    room.bossSpawned = true;
    spawnBoss(CHAPTERS[G.floorIndex].boss);
    G.boss = room.enemies.find((e) => e.boss) || null;
    Audio.boss();
    G.message = BOSS_DEFS[CHAPTERS[G.floorIndex].boss].name + " 挡住了去路";
    G.messageTimer = 170;
  }
  fireEvent("enterRoom", { room });
  revealAdjacent(room);
  updateHUD();
}

function revealAdjacent(room) {
  for (const d of DIR_ORDER) {
    if (!room.doors[d]) continue;
    const nb = G.floor.rooms.get(room.doors[d].to);
    if (nb) G.floor.explored.add(nb.key);
  }
}

function tryDoor(dir) {
  if (!G.room || G.doorCd > 0 || G.state !== "playing") return;
  const room = G.room, door = room.doors[dir];
  if (!door) return;
  if (room.enemies.some((e) => !e.dead)) { toast("房间尚未清空", 900); G.doorCd = 35; return; }
  const target = G.floor.rooms.get(door.to);
  if (!target) return;
  let lock = ROOM_TYPES[target.type] && ROOM_TYPES[target.type].lock;
  if (target.type === "shop" && G.player.trinket === "store_key") lock = null;
  const unlocked = room.unlocked[dir];
  if (lock && !unlocked) {
    if (lock === "key") {
      if (G.player.keys > 0) { G.player.keys--; room.unlocked[dir] = true; toast("用钥匙打开了门", 1200); Audio.key(); }
      else { toast("需要一把钥匙", 1200); Audio.error(); G.doorCd = 40; return; }
    } else if (lock === "health") {
      if (G.player.red + G.player.soul + G.player.black > 2) { spendHealth(2, true); room.unlocked[dir] = true; toast("以半颗心为代价打开了诅咒之门", 1600); Audio.hurt(); }
      else { toast("生命不足，无法打开", 1200); Audio.error(); G.doorCd = 40; return; }
    } else if (lock === "bomb") {
      toast("隐藏门被砖石封住：在附近放炸弹", 1600); G.doorCd = 40; return;
    }
  }
  Audio.door();
  enterRoom(target, { fromDir: dir });
}

function spendHealth(amount, canUseSoul = true) {
  const P = G.player;
  let remain = amount;
  if (canUseSoul && P.soul > 0) { const t = Math.min(P.soul, remain); P.soul -= t; remain -= t; }
  if (remain > 0 && P.black > 0) { const t = Math.min(P.black, remain); P.black -= t; remain -= t; }
  if (remain > 0) { const t = Math.min(P.red, remain); P.red -= t; remain -= t; if (t > 0) G.tookRedDamage = true; }
  if (P.red <= 0 && P.soul <= 0 && P.black <= 0) killPlayer();
}

function onRoomCleared(room) {
  if (!room || room.cleared) return;
  room.cleared = true; G.roomsCleared++;
  if (G.player.active) {
    const gain = G.player.flags.has("double_charge") ? 2 : 1;
    G.player.active.charge = clamp(G.player.active.charge + gain, 0, G.player.active.maxCharge);
  }
  fireEvent("roomClear", { room });
  if (room.type === "boss") onBossDefeated(room);
  else {
    if (chance(0.68)) {
      const roll = rng();
      const what = roll < 0.28 ? "coin" : roll < 0.48 ? "heart" : roll < 0.74 ? "bomb" : "key";
      spawnPickup(what, ROOM_CENTER_X + rand(-70, 70), ROOM_CENTER_Y + rand(-50, 50), { room });
      if (chance(0.16)) spawnPickup(chance(0.5) ? "bomb" : "key", ROOM_CENTER_X + rand(-80, 80), ROOM_CENTER_Y + rand(-60, 60), { room });
    }

  }

}

function onBossDefeated(room) {
  screenShake(18, 36); G.flash = 0.8;
  spawnParticles(ROOM_CENTER_X, ROOM_CENTER_Y, 80, "#c34b4b", 4, 80); Audio.explosion();
  const itemId = rollItem("boss");
  room.pedestals.push({ x: ROOM_CENTER_X - 90, y: ROOM_CENTER_Y + 30, itemId, price: null, taken: false, bob: rng() * TAU, r: 18, cool: 0, dropCd: 0, choiceGroup: G.player.flags.has("options") ? "boss:" + room.key : null });
  if (G.player.flags.has("options")) {
    room.pedestals.push({ x: ROOM_CENTER_X - 10, y: ROOM_CENTER_Y + 30, itemId: rollItem("boss"), price: null, taken: false, bob: rng() * TAU, r: 18, cool: 0, dropCd: 0, choiceGroup: "boss:" + room.key });
  }
  if (G.floorIndex >= CHAPTERS.length - 1) {

  } else {
    room.trapdoor = { x: ROOM_CENTER_X + 90, y: ROOM_CENTER_Y + 30, open: true };
    G.message = "Boss 已击败。活板门通往下一层。"; G.messageTimer = 240;
  }

}

function nextFloor() {
  if (G.floorIndex >= CHAPTERS.length - 1) { triggerVictory(); return; }
  const next = G.floorIndex + 1;
  G.player.tempMods = []; G.player.tempFlags = []; G.player.tempTears = [];
  G.player.invuln = 90; G.player.shieldHits = 0;
  generateFloor(next);
  enterRoom(G.floor.startRoom, { initial: true });
  G.floorTitle = 120; G.message = CHAPTERS[next].name; G.messageTimer = 180;
  G.player.x = ROOM_CENTER_X; G.player.y = ROOM_CENTER_Y; G.player.invuln = 90;
  recalcStats(); fireEvent("newFloor", { floor: G.floor });
  toast(`第 ${next + 1} 层 · ${CHAPTERS[next].name}`, 2200); Audio.door();
}

function trySpawnDevilRoom(bossRoom) {
  const P = G.player;
  let type = null;
  if (P.red > 0 && chance(G.devilChance)) type = "devil";
  else if (chance(G.angelChance)) type = "angel";
  if (!type) return;
  for (const d of shuffle(DIR_ORDER.slice())) {
    const nx = bossRoom.gx + DIRS[d].x, ny = bossRoom.gy + DIRS[d].y;
    if (nx < 0 || nx > 8 || ny < 0 || ny > 8) continue;
    const key = roomKey(nx, ny);
    if (G.floor.rooms.has(key)) continue;
    const room = { gx: nx, gy: ny, type, key, doors: {}, visited: false, cleared: true, init: false, enemies: [], pickups: [], pedestals: [], obstacles: [], hazards: [], decor: [], unlocked: {}, bossSpawned: false, trapdoor: null };
    G.floor.rooms.set(key, room);
    bossRoom.doors[d] = { to: key };
    room.doors[DIRS[d].opp] = { to: bossRoom.key };
    G.devilRoom = room; G.devilDoorDir = d;
    initDevilRoom(room, type);
    break;
  }
}
function initDevilRoom(room, type) {
  room.init = true;
  room.solids = Array.from({ length: ROOM_H }, () => new Array(ROOM_W).fill(0));
  room.pits = Array.from({ length: ROOM_H }, () => new Array(ROOM_W).fill(0));
  room.decor = []; room.hazards = []; room.enemies = []; room.obstacles = []; room.pickups = []; room.pedestals = [];
  const count = type === "devil" ? randInt(2, 3) : 1;
  for (let i = 0; i < count; i++) {
    const x = ROOM_CENTER_X + (i - (count - 1) / 2) * 150;
    const item = rollItem(type === "devil" ? "devil" : "angel");
    const price = type === "devil" ? { hearts: (ITEMS[item] && ITEMS[item].quality >= 4) ? 2 : 1 } : null;
    room.pedestals.push({ x, y: ROOM_CENTER_Y, itemId: item, price, taken: false, bob: rng() * TAU, devil: type === "devil", r: 18, cool: 0, dropCd: 0, choiceGroup: null });
  }
  if (type === "angel") spawnPickup("soul", ROOM_CENTER_X, ROOM_CENTER_Y + 90, { room });
  room.cleared = true;
}

function openBombDoorNear(x, y) {
  const room = G.room;
  if (!room) return;
  for (const d of DIR_ORDER) {
    const door = room.doors[d];
    if (!door) continue;
    const target = G.floor.rooms.get(door.to);
    if (!target || target.type !== "secret" || room.unlocked[d]) continue;
    let dx = ROOM_CENTER_X, dy = ROOM_CENTER_Y;
    if (d === "n") { dx = ROOM_CENTER_X; dy = 0; }
    if (d === "s") { dx = ROOM_CENTER_X; dy = ARENA_H; }
    if (d === "w") { dx = 0; dy = ROOM_CENTER_Y; }
    if (d === "e") { dx = ARENA_W; dy = ROOM_CENTER_Y; }
    if (dist(x, y, dx, dy) < 110) {
      room.unlocked[d] = true;
      toast("隐藏门被炸开了！", 1800);
      screenShake(10, 18);
    }
  }
}

function spawnEnemy(kind, x, y, opts = {}) {

  if (!def) return null;

  const fl = G.floorIndex;
  const hpScale = 1 + fl * 0.46 + (G.difficulty === "hard" ? 0.25 : 0);
  const e = {
    kind, x, y, vx: 0, vy: 0, r: def.r, hp: Math.round(def.hp * hpScale), maxHp: Math.round(def.hp * hpScale),
    speed: def.speed * (1 + fl * 0.035), contact: def.contact, ai: def.ai, shape: def.shape, color: def.color,
    flying: !!def.flying, armor: def.armor || 0, shoot: def.shoot ? { ...def.shoot } : null, shootTimer: def.shoot ? randInt(30, 100) : 0,
    spawnFly: def.spawnFly || 0, spawnTimer: def.spawnFly ? randInt(60, 140) : 0, explodeOnDeath: def.explodeOnDeath || 0,

function spawnBoss(id) {

function spawnPlayerTear(x, y, angle, opts = {}) {
  const P = G.player, s = P.stats, t = P.tear || {};
  const spd = (opts.speed || s.shotSpeed) * (opts.speedMult || 1);

  if (!Number.isFinite(dmg)) dmg = s.damage;
  const rainbow = P.flags && P.flags.has("rainbow_worm") ? pick(["poison", "burn", "freeze", "slow", "charm", "fear"]) : null;
  const tear = {
    x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, angle,
    r: Math.max(4, 7 * s.tearSize * (t.sizeMult || 1)) * (opts.sizeMult || 1),
    damage: dmg, life, maxLife: life, pierce: Math.round(t.pierce || 0), bounce: Math.round(t.bounce || 0),
    spectral: !!t.spectral, homing: t.homing || 0, wavy: !!t.wavy, explosive: !!t.explosive || !!opts.explosive,
    split: Math.round(t.split || 0), boomerang: !!t.boomerang, wrap: !!t.wrap, arcing: !!t.arcing,
    poison: t.poison || 0, burn: t.burn || 0, freeze: t.freeze || 0, slow: t.slow || 0,
    charm: t.charm || 0, fear: t.fear || 0, sizeMult: t.sizeMult || 1,
    [rainbow || "rainbow_none"]: rainbow ? 0.18 : 0,
    color: opts.color || t.color || "#e7dfca", hitSet: new Set(), dead: false,
    owner: opts.owner || "player", friendly: true, phase: rng() * TAU, orbit: t.orbit || false,
    orbitAngle: angle, damageSource: opts.source || "tear", bornFrame: G.frame,
    explosiveRadius: opts.explosiveRadius || 50, big: !!opts.big, returned: false,
  };
  G.tears.push(tear);
  fireEvent("fire", { tear });
  return tear;
}

function spawnBomb(x, y, opts = {}) {
  const P = G.player;
  const b = {
    x, y, vx: opts.vx || 0, vy: opts.vy || 0, r: 14,
    fuse: opts.fuse != null ? opts.fuse : 90,

function spawnPickup(type, x, y, opts = {}) {

function spawnRandomPickup(x, y, room) {

function spawnPedestal(x, y, itemId, opts = {}) {

function spawnObstacleAt(type, x, y) {

  const tx = clamp(Math.floor(x / TILE), 0, ROOM_W - 1), ty = clamp(Math.floor(y / TILE), 0, ROOM_H - 1);
  if (room.solids[ty][tx]) return null;
  return addRoomObstacle(room, type, tx, ty);
}
function spawnCreep(x, y, type, radius, dur) {

  G.creeps.push({ x, y, type, r: radius || 30, life: dur || 100, maxLife: dur || 100, friendly: true, tick: 0, seed: rng() * 1000 });
}
function spawnFriendly(what, count, x, y) {

}
function spawnBossShotRing(x, y, count, speed, offset = 0, color) {

}
function spawnParticles(x, y, count, color, speed = 2, life = 30) {

    const a = rng() * TAU, sp = rand(0.3, 1) * speed;

function spawnHealParticles(x, y, count) { spawnParticles(x, y, count, "#ff9aa2", 1.6, 40); }

function screenShake(amount, time) { G.shake = Math.max(G.shake, amount); G.shakeTime = Math.max(G.shakeTime, time); }

function circleHitsSolid(room, x, y, r, flying) {
  if (x - r < 0 || x + r > ARENA_W || y - r < 0 || y + r > ARENA_H) return true;
  const x0 = Math.max(0, Math.floor((x - r) / TILE)), x1 = Math.min(ROOM_W - 1, Math.floor((x + r) / TILE));
  const y0 = Math.max(0, Math.floor((y - r) / TILE)), y1 = Math.min(ROOM_H - 1, Math.floor((y + r) / TILE));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (!room.solids[ty][tx]) continue;
    // 飞行单位可以越过石头、便便、坑洞与 TNT，只受房间边界限制。
    if (flying) continue;
    const rx = tx * TILE, ry = ty * TILE;
    const cx = clamp(x, rx, rx + TILE), cy = clamp(y, ry, ry + TILE);
    if (dist2(x, y, cx, cy) < r * r) return true;
  }
  return false;
}
function tearHitsSolid(room, x, y, r) {
  if (x - r < 0 || x + r > ARENA_W || y - r < 0 || y + r > ARENA_H) return true;
  const x0 = Math.max(0, Math.floor((x - r) / TILE)), x1 = Math.min(ROOM_W - 1, Math.floor((x + r) / TILE));
  const y0 = Math.max(0, Math.floor((y - r) / TILE)), y1 = Math.min(ROOM_H - 1, Math.floor((y + r) / TILE));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (!room.solids[ty][tx]) continue;
    if (room.pits[ty][tx]) continue; // 眼泪可以飞越坑洞
    const rx = tx * TILE, ry = ty * TILE;
    const cx = clamp(x, rx, rx + TILE), cy = clamp(y, ry, ry + TILE);
    if (dist2(x, y, cx, cy) < r * r) return true;
  }
  return false;
}
function moveEntity(e, dx, dy, opts = {}) {
  const room = G.room;
  if (!room) return;
  const r = e.r || 12, flying = opts.flying != null ? opts.flying : e.flying;
  if (dx) { const nx = e.x + dx; if (!circleHitsSolid(room, nx, e.y, r, flying)) e.x = nx; else if (!opts.noSlide) e.vx = 0; }
  if (dy) { const ny = e.y + dy; if (!circleHitsSolid(room, e.x, ny, r, flying)) e.y = ny; else if (!opts.noSlide) e.vy = 0; }
}
function playerCollidesEnemy(e) { const P = G.player; return dist2(P.x, P.y, e.x, e.y) < (P.r + e.r) * (P.r + e.r); }

function damageEnemy(e, amount, opts = {}) {
  if (!e || e.dead || G.state === "dead" || G.state === "victory") return;
  let dmg = amount;
  if (!Number.isFinite(dmg) || dmg < 0) dmg = 1;
  if (e.armor) dmg *= 1 - e.armor;
  if (e.status && e.status.petrify) dmg *= 1.15;
  e.hp -= dmg;
  e.flash = 5;
  if (opts.status) applyStatus(e, opts.status, opts.dur || 120, opts.power || 0, opts.source);
  if (opts.hitPos) spawnParticles(opts.hitPos.x, opts.hitPos.y, 4, "#b8534e", 1.4, 16);
  if (e.hp <= 0) killEnemy(e, opts);
  else if (e.boss && e.phase === 1 && e.hp < e.maxHp * 0.5) {
    e.phase = 2; G.message = e.name + " 进入了第二阶段"; G.messageTimer = 140; screenShake(8, 18);
  }
}
function killEnemy(e, opts = {}) {
  if (e.dead) return;
  e.dead = true; G.kills++; G.floor.floorKills++;
  spawnParticles(e.x, e.y, e.boss ? 60 : 12, e.color || "#a95353", e.boss ? 4 : 2, e.boss ? 60 : 24);
  Audio.hit();
  if (e.explodeOnDeath) explode(e.x, e.y, e.explodeOnDeath, 22, { friendly: true, color: "#d17d5b", harmPlayer: false });
  if (e.revive > 0 && !e.revived) {
    e.revived = true; e.dead = false; e.hp = Math.ceil(e.maxHp * 0.45); e.revive = 0; e.color = "#c8b59a";
    floatText(e.x, e.y - 24, "复活！", "#d9b86c"); return;
  }
  fireEvent("kill", { enemy: e });
  if (!e.boss) {
    if (chance(0.1)) spawnRandomPickup(e.x, e.y);
    else if (chance(0.18)) spawnPickup(pick(["coin", "coin", "bomb", "key"]), e.x, e.y);
    if (e.kind === "mulligan" && chance(0.4)) spawnEnemy("fly", e.x, e.y);
  }
  checkRoomClear();
}
function checkRoomClear() {
  const room = G.room;
  if (!room || room.cleared) return;
  if (room.enemies.some((e) => !e.dead)) return;
  onRoomCleared(room);
}
function applyStatus(e, status, dur, power, source) {
  if (!e || e.dead) return;
  if (e.boss) dur = Math.round(dur * 0.55);
  e.status = e.status || {};
  const existing = e.status[status];
  e.status[status] = { t: Math.max(existing ? existing.t : 0, dur), power: Math.max(existing ? existing.power : 0, power || 0) };
}
function takeDamage(amount, source = "enemy", ignoreInvuln = false) {
  const P = G.player;
  if (!P || P.dead || G.state === "dead" || G.state === "victory") return;
  if (!ignoreInvuln && P.invuln > 0) return;
  if (!ignoreInvuln && P.shieldHits > 0) {
    P.shieldHits--; P.invuln = 45; P.invulnMax = 45;
    spawnParticles(P.x, P.y, 20, "#cfe6ff", 2.4, 28);
    Audio.tone(880, 0.12, "sine", 0.05, 200);
    fireEvent("damaged", { amount: 0, blocked: true }); return;
  }
  if (!ignoreInvuln && P.flags.has("infamy") && chance(0.12)) {
    P.invuln = 30; spawnParticles(P.x, P.y, 12, "#e6d6bd", 2, 20);
    fireEvent("damaged", { amount: 0, blocked: true }); return;
  }
  let dmg = Math.max(1, Math.round(amount));
  if (P.flags.has("wafer")) dmg = Math.min(dmg, 1);
  let remain = dmg;
  if (P.black > 0) {
    const take = Math.min(P.black, remain); P.black -= take; remain -= take;
    if (take > 0) for (const en of G.room.enemies.slice()) if (!en.dead) damageEnemy(en, 8);
  }
  if (remain > 0 && P.soul > 0) { const take = Math.min(P.soul, remain); P.soul -= take; remain -= take; }
  if (remain > 0) {
    const take = Math.min(P.red, remain); P.red -= take; remain -= take;
    G.tookRedDamage = true; G.devilChance = Math.max(0, G.devilChance - 0.08);
  }
  P.charging = false; P.chargeT = 0; P.chargeFullPlayed = false;
  G.damageTaken += dmg; P.invuln = 62; P.invulnMax = 62;
  screenShake(9, 20); G.flash = 0.35; Audio.hurt();
  spawnParticles(P.x, P.y, 16, "#b9343d", 2.4, 30);
  fireEvent("damaged", { amount: dmg, source });
  if (P.red + P.soul + P.black <= 0) killPlayer();
}
function killPlayer() {
  const P = G.player;
  if (!P || P.dead) return;
  P.dead = true;
  fireEvent("death", {});
  if (!P.dead) return;
  if (P.extraLives > 0) {
    P.extraLives--; P.dead = false; P.red = 0; P.soul = 2; P.black = 0; P.invuln = 180; G.revived++;
    toast(`一条命换一条命（剩余 ${P.extraLives}）`, 2500);
    spawnParticles(P.x, P.y, 50, "#d9b86c", 3, 60); return;
  }
  G.state = "dead"; Audio.death();
  setTimeout(() => { if (G && G.state === "dead") showEnd(false); }, 900);
}
function explode(x, y, radius, damage, opts = {}) {
  G.explosions.push({ x, y, r: radius, life: 16, maxLife: 16, color: opts.color || "#ffb35e" });
  screenShake(Math.min(14, radius / 10), 18); Audio.explosion();
  spawnParticles(x, y, 34, opts.color || "#ffb35e", 3.4, 36);
  for (const e of (G.room.enemies || []).slice()) {
    if (!e.dead && !opts.noEnemyDamage && dist(x, y, e.x, e.y) < radius + e.r) damageEnemy(e, damage, { source: "explosion" });
  }
  for (const o of G.room.obstacles.slice()) {
    if (o.dead) continue;
    if (dist(x, y, o.x, o.y) < radius + o.r) {
      if (o.type === "tnt") { destroyObstacle(o); spawnBomb(o.x, o.y, { fuse: 6, harming: false }); }
      else destroyObstacle(o);
    }
  }
  for (const h of G.room.hazards.slice()) {
    if (h.type === "fire" && dist(x, y, h.x, h.y) < radius + h.r) extinguishFire(h);
  }
  openBombDoorNear(x, y);
  const P = G.player;
  if (opts.harmPlayer && dist(x, y, P.x, P.y) < radius && P.invuln <= 0) takeDamage(2, "bomb", true);
  for (const b of G.bombs) if (!b.exploded && dist(x, y, b.x, b.y) < radius + 16) b.fuse = Math.min(b.fuse, 4);
  if (P.flags.has("sad_bombs")) for (let i = 0; i < 8; i++) spawnPlayerTear(x, y, (i / 8) * TAU + rng() * 0.2, { source: "bomb", range: 3.2, damageMult: 0.6 });
  if (P.flags.has("poison_bombs")) for (let i = 0; i < 3; i++) spawnCreep(x + rand(-radius * 0.5, radius * 0.5), y + rand(-radius * 0.5, radius * 0.5), "poison", 38, 170);
  if (P.flags.has("hot_bombs")) for (const e of G.room.enemies) if (!e.dead && dist(x, y, e.x, e.y) < radius + 30) applyStatus(e, "burn", 120, 0.2);
}
function extinguishFire(h) {
  const room = G.room;
  const idx = room.hazards.indexOf(h);
  if (idx < 0) return;
  room.hazards.splice(idx, 1);
  spawnParticles(h.x, h.y, 14, "#d9c9b1", 2, 26);
  spawnParticles(h.x, h.y, 6, "#cf6b43", 1.4, 18);
  if (chance(0.1)) spawnPickup("coin", h.x, h.y);
}
function updateHazards() {
  for (const h of G.room.hazards) {
    if (h.type !== "fire") continue;
    for (const e of G.room.enemies) {
      if (e.dead) continue;
      if (dist(e.x, e.y, h.x, h.y) < h.r + e.r + 8) {
        if (!e.fireCd || G.frame - e.fireCd > 36) {
          e.fireCd = G.frame;
          damageEnemy(e, 2, { source: "fire" });
          applyStatus(e, "burn", 90, 0.12);
        }
      }
    }
  }
}
function destroyObstacle(o) {
  if (o.dead) return;
  o.dead = true; const room = G.room; o.hp = 0;
  room.solids[o.ty][o.tx] = 0; room.pits[o.ty][o.tx] = 0;
  spawnParticles(o.x, o.y, 10, o.type === "poop" ? "#7c5c3e" : "#8e8272", 2, 22);
  if (o.type === "poop") { fireEvent("poopBreak", { x: o.x, y: o.y }); if (chance(0.16)) spawnPickup("coin", o.x, o.y); }
  else { fireEvent("rockBreak", { x: o.x, y: o.y }); if (chance(0.08)) spawnPickup(pick(["coin", "bomb", "key", "heart"]), o.x, o.y); }
  updateRoomSolidity(room);
}

/* =====================================================================
 * 11. 玩家更新
 * ===================================================================== */
function updatePlayer() {
  const P = G.player, room = G.room;
  if (!room || P.dead) return;
  P.anim += 0.06;
  if (P.invuln > 0) P.invuln--;
  if (P.shieldTimer > 0) P.shieldTimer--;
  if (G.doorCd > 0) G.doorCd--;
  if (P.fireCd > 0) P.fireCd--;
  let mx = 0, my = 0;
  if (Keys.KeyA) mx -= 1; if (Keys.KeyD) mx += 1;
  if (Keys.KeyW) my -= 1; if (Keys.KeyS) my += 1;
  if (mx || my) { const n = norm(mx, my); mx = n.x; my = n.y; P.walking += 0.14; } else P.walking += 0.03;
  P.vx = lerp(P.vx, mx * P.stats.speed, 0.28);
  P.vy = lerp(P.vy, my * P.stats.speed, 0.28);
  moveEntity(P, P.vx, P.vy, { flying: P.flying });
  const aim = aimVector();
  if (aim) P.aim = aim.angle;
  if (P.attackType === "brimstone") updateBrimstoneCharge();
  else {
    if (P.charging) { P.charging = false; P.chargeT = 0; }
    if (wantsFire() && P.fireCd <= 0) fireWeapon();
  }
  // 操作：E 放炸弹，空格使用主动道具；Q 使用卡牌/药丸。
  if (wasPressed("KeyE")) dropBomb();
  if (wasPressed("Space")) useActive();
  if (wasPressed("KeyQ")) useConsumable();
  collectNearby();
  // 站在活板门上会自动下层，不需要像素级对齐；离开则取消。
  if (G.room.trapdoor && G.room.trapdoor.open && dist(P.x, P.y, G.room.trapdoor.x, G.room.trapdoor.y) < 40) {
    G.trapdoorCharge = (G.trapdoorCharge || 0) + 1;
    if (G.trapdoorCharge >= 14) { G.trapdoorCharge = 0; nextFloor(); return; }
  } else G.trapdoorCharge = 0;
  checkDoorTouch(mx, my);
  checkHazards();
  for (const e of room.enemies) {
    if (e.dead) continue;
    if (playerCollidesEnemy(e)) {
      if (P.contactBuff && G.frame < P.contactBuff.until) damageEnemy(e, P.contactBuff.damage, { source: "contact" });
      fireEvent("touchEnemy", { enemy: e });
      takeDamage(e.contact || 1, e.boss ? "boss" : "enemy");
    }
  }
  for (const s of G.enemyShots) {
    if (s.dead) continue;
    if (dist2(P.x, P.y, s.x, s.y) < (P.r + s.r) * (P.r + s.r)) { s.dead = true; takeDamage(s.damage, "shot"); }
  }
  updateOrbitals(); updateFamiliars(); updateTrails(); updateAuras();
  updateTears(); updateBombs(); updateParticles(); updatePickups();
  if (G.frame % 30 === 0) recalcStats();
  ensureGroundPosition();
}
function updateBrimstoneCharge() {
  const P = G.player;
  // 硫磺火持续期间不能蓄力，必须等光束结束。
  if (G.beams.some((b) => b.brimstone && b.life > 0)) {
    P.charging = false; P.chargeT = 0; P.chargeFullPlayed = false;
    return;
  }
  const held = wantsFire();
  if (held) {
    if (!P.charging) {
      P.charging = true; P.chargeT = 0; P.chargeFullPlayed = false;
      Audio.tone(130, 0.12, "sawtooth", 0.025, 40);
    }
    P.chargeT = Math.min(P.chargeMax, P.chargeT + 1);
    if (P.chargeT % 7 === 0) {
      spawnParticles(P.x + Math.cos(P.aim) * 14, P.y + Math.sin(P.aim) * 14, 2, "#d14a4a", 1.2, 14);
    }
    if (P.chargeT >= P.chargeMax && !P.chargeFullPlayed) {
      P.chargeFullPlayed = true;
      Audio.tone(320, 0.12, "sine", 0.035, 140);
    }
  } else if (P.charging) {
    const ratio = clamp(P.chargeT / P.chargeMax, 0, 1);
    P.charging = false; P.chargeT = 0; P.chargeFullPlayed = false;
    if (ratio >= 0.25) fireBrimstone(ratio);
    else Audio.error();
  }
}

function fireBrimstone(chargeRatio = 1) {
  const P = G.player, s = P.stats;
  const ratio = clamp(chargeRatio, 0, 1);
  const power = 0.45 + ratio * 0.55;
  const rangeTiles = P.brimstoneInfinite ? 40 : 4.2;
  // 追踪不负责“锁定发射方向”，而是让光束在持续期间弯曲追踪敌人。
  for (let i = 0; i < s.shots; i++) {
    const off = (i - (s.shots - 1) / 2) * Math.max(0.06, s.shotSpread || 0.08);
    fireLaser(P.aim + off, s.damage * 3 * power, (20 + s.tearSize * 4) * (0.65 + ratio * 0.35), rangeTiles, {
      color: "#c83f48", chargeRatio: ratio, brimstone: true, pierceWalls: true,
    });
  }
  P.fireCd = 0;
  P.charging = false; P.chargeT = 0; P.chargeFullPlayed = false;
  screenShake(3 + ratio * 5, 8);
  Audio.laser();
}

function fireWeapon() {
  const P = G.player, s = P.stats, attack = P.attackType;
  if (attack === "brimstone") { fireBrimstone(1); return; }
  if (attack === "tech") {
    for (let i = 0; i < s.shots; i++) {
      const off = (i - (s.shots - 1) / 2) * Math.max(0.05, s.shotSpread || 0.07);
      fireLaser(P.aim + off, s.damage * 1.35, 10 + s.tearSize * 2, s.range, { color: "#b9e2d0", tech: true });
    }
    P.fireCd = Math.round(s.fireDelay); Audio.laser(); return;
  }
  if (attack === "knife") {
    for (let i = 0; i < s.shots; i++) {
      const off = (i - (s.shots - 1) / 2) * Math.max(0.05, s.shotSpread || 0.06);
      const t = spawnPlayerTear(P.x, P.y, P.aim + off, { speed: 11, range: Math.max(3, s.range), sizeMult: 2.8, source: "knife" });
      t.knife = true; t.pierce = 99; t.returning = false; t.returnDelay = Math.min(28, t.maxLife * 0.55); t.damage = s.damage * 2.5;
    }
    P.fireCd = Math.round(s.fireDelay * 1.4); Audio.shoot(); return;
  }
  if (attack === "epic_fetus") {
    const tx = clamp(P.x + Math.cos(P.aim) * 260, 40, ARENA_W - 40), ty = clamp(P.y + Math.sin(P.aim) * 260, 40, ARENA_H - 40);
    G.telegraphs.push({ x: tx, y: ty, r: 60, life: 22, maxLife: 22, type: "missile" });
    setTimeoutGame(() => { if (G && G.state !== "dead") explode(tx, ty, 90, s.damage * 3, { harmPlayer: true, color: "#ff9d4f" }); }, 22);
    P.fireCd = Math.round(s.fireDelay * 3.2); Audio.shoot(); return;
  }
  if (attack === "dr_fetus") {
    for (let i = 0; i < s.shots; i++) {
      const off = (i - (s.shots - 1) / 2) * Math.max(0.05, s.shotSpread || 0.06);
      const t = spawnPlayerTear(P.x, P.y, P.aim + off, { speed: 7.5, source: "bomb_tear", sizeMult: 1.5 });
      t.bombTear = true;
    }
    P.fireCd = Math.round(s.fireDelay * 1.8); Audio.shoot(); return;
  }
  const shots = s.shots;
  for (let i = 0; i < shots; i++) {
    const off = (i - (shots - 1) / 2) * (s.shotSpread || 0.055);
    spawnPlayerTear(P.x, P.y, P.aim + off);
  }
  if (P.tear.crossshot) for (const a of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) if (Math.abs(angleDiff(P.aim, a)) >= 0.1) spawnPlayerTear(P.x, P.y, a, { damageMult: 0.7 });
  if (P.tear.backshot) spawnPlayerTear(P.x, P.y, P.aim + Math.PI, { damageMult: 0.75 });
  P.fireCd = Math.max(2.2, s.fireDelay); P.tearsFired += shots;
  Audio.shoot();
  spawnParticles(P.x + Math.cos(P.aim) * 14, P.y + Math.sin(P.aim) * 14, 2, "#e8dcc4", 0.8, 8);
}
function fireLaser(angle, damage, width, rangeTiles, opts = {}) {
  const P = G.player;
  let length = Math.max(90, (rangeTiles || 6) * TILE);
  const spectral = P.tear.spectral;
  if (opts.brimstone) {
    const beam = {
      x: P.x, y: P.y, angle, length, width: width || 14, damage,
      life: 30, maxLife: 30, hits: new Set(), hitOnce: new Set(), curveHit: new Set(),
      color: opts.color || "#c83f48", brimstone: true, pierceWalls: true,
      ticksLeft: 9, tickTimer: 0, homing: (P.tear && P.tear.homing) || 0,
      curveAngle: angle, path: [{ x: P.x, y: P.y }], range: length,
    };
    buildBrimstonePath(beam);
    G.beams.push(beam);
    screenShake(5, 7);
    return;
  }
  if (opts.pierceWalls) { /* 非硫磺火也可标记穿墙，保留给未来的激光道具。 */ }
  for (let d = 10; d < length; d += 8) {
    if (opts.pierceWalls) continue;
    const x = P.x + Math.cos(angle) * d, y = P.y + Math.sin(angle) * d;
    if (x < 0 || x > ARENA_W || y < 0 || y > ARENA_H) { length = d; break; }

      }

function distPointToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;

}
function distToPath(px, py, path) {
  if (!path || path.length === 0) return Infinity;
  if (path.length === 1) return dist(px, py, path[0].x, path[0].y);
  let best = Infinity;
  for (let i = 1; i < path.length; i++) {
    const d = distPointToSegment(px, py, path[i - 1].x, path[i - 1].y, path[i].x, path[i].y);
    if (d < best) best = d;

function buildBrimstonePath(b) {
  const P = G.player;
  b.x = P.x; b.y = P.y;
  const step = 20;
  const count = Math.max(2, Math.min(120, Math.ceil(b.range / step)));
  let angle = b.curveAngle != null ? b.curveAngle : b.angle;
  let x = b.x, y = b.y;
  b.path = [{ x, y }];
  for (let i = 0; i < count; i++) {
    if (b.homing > 0 && G.room.enemies.length) {
      let target = null, best = Math.min(1200, b.range || 1200);
      for (const e of G.room.enemies) {
        if (e.dead || b.curveHit.has(e)) continue;
        const d = dist(x, y, e.x, e.y);
        if (d < best) { best = d; target = e; }
      }
      if (!target) {
        for (const e of G.room.enemies) {
          if (e.dead || b.curveHit.has(e)) continue;
          const d = dist(x, y, e.x, e.y);
          if (d < best) { best = d; target = e; }
        }
      }
      if (target) {
        angle = lerpAngle(angle, Math.atan2(target.y - y, target.x - x), 0.18);
        // 弯曲有上限，避免无限射程的激光绕圈跑出房间。
        angle = b.angle + clamp(angleDiff(b.angle, angle), -1.05, 1.05);
        if (dist(x, y, target.x, target.y) < 42) b.curveHit.add(target);
      }
    }
    x += Math.cos(angle) * step;
    y += Math.sin(angle) * step;
    b.path.push({ x, y });
  }
  b.curveAngle = angle;
  b.length = count * step;
}
function laserWorldHitPath(path, width, damage) {

    if (distToPath(h.x, h.y, path) < width * 0.55 + h.r) extinguishFire(h);
  }
  for (const o of G.room.obstacles.slice()) {
    if (o.dead || !["poop", "tnt"].includes(o.type)) continue;
    if (distToPath(o.x, o.y, path) > width * 0.55 + o.r) continue;
    o.hp -= Math.max(2, damage);
    spawnParticles(o.x, o.y, 5, o.type === "poop" ? "#7c5c3e" : "#b07a54", 1.5, 16);
    if (o.hp <= 0) {
      destroyObstacle(o);

  }
}
function applyBrimstoneTick(b) {

function laserWorldHit(x, y, angle, length, width, damage) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const reachPoint = (ox, oy) => {
    const proj = clamp((ox - x) * cos + (oy - y) * sin, 0, length);
    return { x: x + cos * proj, y: y + sin * proj, proj };
  };
  for (const h of G.room.hazards.slice()) {
    if (h.type !== "fire") continue;
    const p = reachPoint(h.x, h.y);
    if (dist(p.x, p.y, h.x, h.y) < width * 0.55 + h.r) extinguishFire(h);
  }
  for (const o of G.room.obstacles.slice()) {
    if (o.dead || !["poop", "tnt"].includes(o.type)) continue;
    const p = reachPoint(o.x, o.y);
    if (dist(p.x, p.y, o.x, o.y) > width * 0.55 + o.r) continue;
    o.hp -= Math.max(2, damage);
    spawnParticles(o.x, o.y, 6, o.type === "poop" ? "#7c5c3e" : "#b07a54", 1.6, 18);
    if (o.hp <= 0) {
      destroyObstacle(o);
      if (o.type === "tnt") spawnBomb(o.x, o.y, { fuse: 4 });

}

function ensureGroundPosition() {
  const P = G.player, room = G.room;
  if (!room || P.flying) return;
  if (!circleHitsSolid(room, P.x, P.y, P.r, false)) return;
  const baseX = Math.floor(P.x / TILE), baseY = Math.floor(P.y / TILE);
  let best = null, bestD = Infinity;
  for (let ty = 0; ty < ROOM_H; ty++) for (let tx = 0; tx < ROOM_W; tx++) {

    const d = dist2(P.x, P.y, x, y);

  }
  if (!best) best = { x: ROOM_CENTER_X, y: ROOM_CENTER_Y };
